{% extends "base.html" %}

{% block title %}Login - Aplus Player{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h1>Login to Aplus Player</h1>
        <p class="subtitle">Enter your Aplus Education credentials</p>
        
        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" placeholder="07XXXXXXXXX" required>
                <small>Enter your registered mobile number</small>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        
        <div id="login-error" class="error-message hidden"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const mobile = document.getElementById('mobile').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('login-error');
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ mobile, password })
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
            window.location.href = '/courses';
        } else {
            errorDiv.textContent = data.error || 'Login failed';
            errorDiv.classList.remove('hidden');
        }
    } catch (error) {
        errorDiv.textContent = 'Network error. Please try again.';
        errorDiv.classList.remove('hidden');
    }
});
</script>
{% endblock %}
