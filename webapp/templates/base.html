<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aplus Player{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="{{ url_for('courses.index') }}">Aplus Player</a>
            </div>
            <div class="nav-links">
                {% if session.get('token') %}
                <a href="{{ url_for('courses.courses_page') }}">Courses</a>
                <a href="#" onclick="logout()">Logout</a>
                {% else %}
                <a href="{{ url_for('auth.login_page') }}">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Unofficial Aplus Player - For personal use with your own paid account</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
