# Aplus Player web service — multi-user deployment.
#
#   docker compose up --build -d
#
# The shared SQLite state (active sessions, download progress) lives in the
# `aplus_state` volume so it survives restarts and is shared across all
# gunicorn workers.
#
# IMPORTANT: The container runs as a specific UID/GID to avoid permission
# conflicts on the mounted ./data volume. The default is 1000:1000 (the first
# non-root user on most Linux distros). If your host UID/GID differs, set the
# APLUS_UID and APLUS_GID environment variables (or edit the `user:` line
# below) before running `docker compose up`:
#
#   export APLUS_UID=$(id -u)  # e.g. 1000
#   export APLUS_GID=$(id -g)  # e.g. 1000
#   docker compose up -d
services:
  aplus:
    build: .
    container_name: aplus-player
    restart: unless-stopped
    # Run as the host UID/GID so SQLite database files (and WAL/SHM sidecars)
    # created on the mounted ./data volume are readable/writable by both the
    # container and the host. Override APLUS_UID/APLUS_GID if your IDs differ.
    user: "${APLUS_UID:-1000}:${APLUS_GID:-1000}"
    ports:
      - "5000:5000"
    environment:
      # REQUIRED in production: a long random value that signs user sessions.
      # Generate one with:  openssl rand -hex 32
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-change-me-to-a-long-random-string}"
      # Where the shared SQLite state lives (persistent volume mounted below).
      APLUS_STATE_DB: /data/aplus_state.db
      # Optional tuning (defaults are sane):
      # GUNICORN_WORKERS: "2"
      # GUNICORN_THREADS: "8"
      # GUNICORN_TIMEOUT: "600"
    volumes:
      - ./data:/data
