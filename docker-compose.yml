# Aplus Player web service — multi-user deployment.
#
#   docker compose up --build -d
#
# The shared SQLite state (active sessions, download progress) lives in the
# `aplus_state` volume so it survives restarts and is shared across all
# gunicorn workers.
services:
  aplus:
    build: .
    container_name: aplus-player
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # REQUIRED in production: a long random value that signs user sessions.
      # Generate one with:  openssl rand -hex 32
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-change-me-to-a-long-random-string}"
      # Where the shared SQLite state lives (persistent volume mounted below).
      APLUS_STATE_DB: /data/aplus_state.db
      # Optional tuning (defaults are sane):
      # GUNICORN_WORKERS: "2"
      # GUNICORN_THREADS: "8"
      # GUNICORN_TIMEOUT: "600"
    volumes:
      - ./data:/data
